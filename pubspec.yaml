name: orbit
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  dio: ^5.11.1
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.0.2
  slang_flutter: ^4.19.0
  intl: ^0.20.3
  lottie: ^3.6.1
  flutter_svg: ^2.3.0
  firebase_core: ^5.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  slang: ^4.19.2
  change_app_package_name: ^1.5.0


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/svgs/onboarding/slide_1_projects/
    - assets/svgs/onboarding/slide_2_people/
    - assets/svgs/onboarding/slide_3_finance/
    - assets/svgs/onboarding/slide_4_insights/
